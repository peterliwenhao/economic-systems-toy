# 固定运输损耗调整版。时间、生产、健康、主体与地块参数沿用第一版主体参数。
# 运输损耗按“每条调拨指令”结算：同品类、同起点、同终点的请求可先合并，合并后只扣除一次固定损耗。
# 所有时间变量继续使用 hours；所有参数均为具体校准值。
schema_version: '1.1'
model_name: LLM-driven closed economy ABM
parameter_status: fixed-transport-loss adjustment calibration values
global_environment:
  economy_type: closed
  population_count: 16
  goods:
  - grain
  - iron
  ownership: state_owned_production_assets
  currency_enabled: false
  labor_voucher_enabled: false
  private_account_enabled: false
  seasonality_enabled: false
  vehicles_enabled: false
  misreporting_enabled: false
  static_storage_loss_rate: 0.0
  random_seed: 20260927
time:
  action_round:
    count: 1
    duration_hours: 40.0
  grain_maturity:
    action_rounds: 1
    duration_hours: 40.0
  planning_period:
    action_rounds: 1
    duration_hours: 40.0
  settlement_order:
  - production
  - harvest
  - allocation
  - circulation
  - transport
  - consumption
map:
  geometry: hexagonal
  radius: 3
  tile_count: 37
  coordinate_system: axial_q_r
  hex_distance_formula: (abs(dq) + abs(dr) + abs(dq + dr)) / 2
physical_rules:
  inventory_balance: inventory_next = inventory + production + inflow - input_use - consumption - outflow - loss
  transport_loss_mode: fixed_absolute_loss_per_transfer_order
  transport_loss_settlement_unit: one_transfer_order
  grain_transport_loss_units_per_hex_per_transfer: 0.05
  iron_transport_loss_units_per_hex_per_transfer: 0.02
  transport_loss_formula: transport_loss = min(sent_quantity, fixed_loss_units_per_hex_per_transfer * distance_hex)
  transport_arrival_formula: arrival_quantity = max(sent_quantity - fixed_loss_units_per_hex_per_transfer * distance_hex,
    0)
  consolidation_rule: same_good_same_origin_same_destination_requests_may_be_merged_before_transport_settlement
  consolidated_transfer_loss_rule: a_merged_transfer_order_is_charged_fixed_transport_loss_once
  minimum_arrival_quantity: 0.0
  grain_iron_input_per_unit: 0.08
  household_grain_capacity: 14.0
  household_initial_grain: 7.0
  household_iron_capacity: 0.0
  household_initial_iron: 0.0
  target_safety_stock_action_rounds: 7
  health_minimum: 0.0
  health_maximum: 10.0
  health_initial: 8.0
  acute_labor_floor: 0.6
  acute_labor_nutrition_weight: 0.4
  illness_multiplier_baseline: 1.0
  health_labor_multiplier_steps:
  - minimum_health: 8.0
    multiplier: 1.0
  - minimum_health: 6.0
    multiplier: 0.9
  - minimum_health: 4.0
    multiplier: 0.75
  - minimum_health: 2.0
    multiplier: 0.5
  - minimum_health: 1.0e-06
    multiplier: 0.25
  - minimum_health: 0.0
    multiplier: 0.0
  health_update_formula: health_next = clip(health + recovery_coefficient * max(consumption - minimum_consumption, 0) - shortage_damage_coefficient
    * max(minimum_consumption - consumption, 0) - overtime_damage_per_hour * max(actual_work_hours - safe_work_hours, 0),
    0, 10)
  acute_labor_formula: acute_multiplier_next = 0.60 + 0.40 * min(1, consumption / minimum_consumption)
  effective_labor_formula: effective_labor_hours = actual_work_hours * sector_skill * health_multiplier * acute_multiplier
    * illness_multiplier
production_technology:
  grain:
    output_function: 0.32 * min(L, 60) + 0.26 * min(max(L - 60, 0), 40) + 0.18 * min(max(L - 100, 0), 30)
    labor_input_unit: hours
    first_segment_upper_hours: 60.0
    second_segment_upper_hours: 100.0
    third_segment_upper_hours: 130.0
    first_segment_output_per_hour: 0.32
    second_segment_output_per_hour: 0.26
    third_segment_output_per_hour: 0.18
    iron_input_per_grain: 0.08
    capacity_per_farm_per_action_round: 45.0
    maturity_hours: 40.0
  iron:
    output_per_effective_labor_hour: 0.95
    labor_input_unit: hours
    resource_depletion_enabled: false
allocation_rule:
  shortage_method: seeded_random_basic_need_allocation
  allocation_unit: 0.01
  random_seed: 20260927
  household_request_formula: max(minimum_consumption * 7 - home_grain_inventory, 0)
