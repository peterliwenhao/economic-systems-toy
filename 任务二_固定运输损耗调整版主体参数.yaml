  validates_permissions: true
  settles_production: true
  settles_inventory: true
  settles_transport_loss: true
  settles_consumption: true
  settles_health: true
  allows_direct_llm_inventory_write: false
  allows_direct_llm_health_write: false
  allows_direct_llm_output_write: false
